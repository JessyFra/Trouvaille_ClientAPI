nelmio_api_doc:
    documentation:
        info:
            title: Trouvaille API
            description: API REST du site de petites annonces entre particuliers
            version: 1.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - bearerAuth: []
    areas:
        path_patterns:
            - ^/api(?!/doc$)